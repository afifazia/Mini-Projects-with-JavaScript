<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Library Manager</title>
</head>
<body>
    
    <script>
        const library = [];

        function addBook(name, author, pages, readOrUnread) {
            const book = {
            title: name,
            author: author,
            pages: pages,
            isRead: readOrUnread
            }
            library.push(book);
        };

        addBook('Atomic Habits', 'James Clear', 345, true);
        addBook("The Hobbit", "J.R.R. Tolkien", 295, false);
        addBook('The Almanack of Naval Ravikant', 'Eric Jorgenson', 267, false);

        let count = 1;
        for (const books of library) {
            console.log(`Book: ${count}`);
            console.log(`Title: ${books.title}`);
            console.log(`Author: ${books.author}`);
            console.log(`Pages: ${books.pages}`);
            console.log(`Read: ${books.isRead}`);
            count++;
        }

        function countBooks() {
            console.log('There are ' + library.length + ' books.');
        }
        countBooks();

        function readBooks() {
            for (const books of library) {
            if(books.isRead) {
                console.log(`You Have Read: ${books.title} by ${books.author}.`);
            }
          }
        }
        readBooks();

        function unreadBooks() {
            for (const books of library) {
                if(books.isRead === 'No') {
                    console.log(`You Haven't Read: ${books.title} by ${books.author}.`);
                }
            }
        }
        unreadBooks();


        function biggestBook() {
            let bigBook = 0;
            for(const books of library) {
                if (books.pages > bigBook) {
                    bigBook = books.pages;
                    console.log(`Biggest Book: ${bigBook} pages\nCalled: ${books.title}\nBy: ${books.author}`);
                }
            }
        }
        biggestBook();
    </script>
</body>
</html>
