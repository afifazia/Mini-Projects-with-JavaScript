<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        button {
            font-size: 16px;
            font-weight: bold;
            background-color: black;
            color: white;
            border-radius: 6px;
            border: none;
            padding: 10px;
            margin-right: 6px;
            transition: box-shadow 0.25ms;
            cursor: pointer;
        }
        button:hover{
            box-shadow: 2px 2px 6px gray;
        }
    </style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
</head>
<body>

    <h1 id="count" style="margin-left: 150px;"> 0 </h1>
    <button id="increase">Increase</button>
    <button id="decrease">Decrease</button>
    <button id="increase-by-ten">+10</button>
    <button id="reset">Reset</button>
    
    <script>
        let count = JSON.parse(localStorage.getItem('count')) || 0;
        saveCount();
        updateCount();

        function updateCount() {
            document.querySelector('#count').textContent = `${count}`;
            saveCount();
        };

        function increaseCount() {
            count += 1;
            updateCount();
        };
        const increaseBtn = document.querySelector('#increase');
        increaseBtn.addEventListener('click', increaseCount);


        function decreaseCount() {
            count -= 1;
            updateCount();
            saveCount();
        };
        const deacreaseBtn = document.querySelector('#decrease');
        deacreaseBtn.addEventListener('click', decreaseCount);


        function increaseByTen() {
            count += 10;
            updateCount();
            saveCount();
        };
        const increaseTen = document.querySelector('#increase-by-ten');
        increaseTen.addEventListener('click', increaseByTen);


        function resetBtn() {
            count = 0;
            updateCount();
            saveCount();
        };
        const resetButton = document.querySelector('#reset');
        resetButton.addEventListener('click', resetBtn);


        function saveCount() {
            localStorage.setItem('count', JSON.stringify(count));
        };
    </script>
</body>
</html>
