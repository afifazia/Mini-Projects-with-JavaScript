<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            background: linear-gradient(180deg, #263d44, darkslategray);
            background-clip: text;
            color: transparent;
        }

        p {
            white-space: pre-line;
            color: #272747;
        }

        input {
            margin-left: 20px;
            padding: 10px;
            border: 1px solid #363636;
            border-radius: 8px;
            box-shadow: 1px 1px 14px #858484;
        }
        
        button {
            background: linear-gradient(180deg, #272747, #f156cb);
            padding: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: box-shadow 0.15s;
            cursor: pointer;
        }
        button:hover {
            box-shadow: 2px 2px 10px #363636;
        }
        button:active {
            translate: 1px 1px;
        }

        .delete-btn {
            background: linear-gradient(180deg, #272747, #363636);
            padding: 14px;
            color: white;
            cursor: pointer;
        }
    </style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist</title>
</head>
<body>
    <h1>Movie Watchlist</h1>

    <label for="movie-name">Movie Title:</label>
    <input type="text" placeholder="Type a movie..." id="movie-name"> <br><br>

    <label for="movie-genre">Movie Genre:</label>
    <input type="text" placeholder="Type the genre..." id="movie-genre"> <br><br>

    <label for="movie-rating">Movie Rating:</label>
    <input type="text" placeholder="Type the rating..." id="movie-rating"> <br><br>

    <label for="year">Movie Year:</label>
    <input type="text" placeholder="Type the year..." id="year"> <br><br>

    <button id="add-movie-btn">Add Movie</button>

    <p id="error-para"></p>
    <div id="display"></div>

    <script>

        const movies = JSON.parse(localStorage.getItem('movies')) || [];

        const movieName = document.querySelector('#movie-name');
        const movieGenre = document.querySelector('#movie-genre');
        const movieRating = document.querySelector('#movie-rating');
        const movieYear = document.querySelector('#year');

        const errorParagraph = document.querySelector('#error-para');

        const addMovieBtn = document.querySelector('#add-movie-btn');
        const displayMovies = document.querySelector('#display');


        function renderMovies() {

            displayMovies.innerHTML = ``;
            for (const movie of movies) {
                const paragraph = document.createElement('p');
                paragraph.innerHTML = `
                <b>Title:</b> ${movie.name}\n<b>Genre:</b> ${movie.genre}\n<b>Rating:</b> ${movie.rating}\n<b>Year:</b> ${movie.year}\n<b>Status:</b> <span style="color: green;">${movie.status}</span>\n\n`;

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = `Delete`;
                deleteBtn.classList.add('delete-btn');

                deleteBtn.addEventListener('click', () => {
                    const movieIndex = movies.indexOf(movie);
                    movies.splice(movieIndex, 1);
                    saveMovies();
                    renderMovies();
                })

                displayMovies.append(paragraph);
                paragraph.append(deleteBtn);
            }

            movieName.value = '';
            movieGenre.value = '';
            movieRating.value = '';
            movieYear.value = '';
        };


        function movieWatchlist() {

            if (movieName.value.trim() === '' ||
            movieGenre.value.trim() === '' ||
            movieRating.value.trim() === '' ||
            movieYear.value.trim() === '')  {
                errorParagraph.textContent = `Error: Empty Input!`;
                errorParagraph.style.color = `red`;
                return;
            }
            errorParagraph.textContent = '';
            
            movies.unshift({
                name: movieName.value.trim(),
                genre: movieGenre.value.trim(),
                rating: movieRating.value.trim(),
                year: movieYear.value.trim(),
                status: "Watch Later"
            });
            saveMovies();

            renderMovies();
            };
        addMovieBtn.addEventListener('click', movieWatchlist);


        function saveMovies() {
            localStorage.setItem('movies', JSON.stringify(movies));
        };

        renderMovies(); //Page loads, Immediately render/sgow what's already saved.
    </script>
</body>
</html>
