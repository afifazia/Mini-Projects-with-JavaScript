<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        h1 {
            background: linear-gradient(180deg, #290f88, #381438);
            background-clip: text;
            color: transparent;
        }

        p {
            white-space: pre-line;
        }

        input {
            margin-left: 20px;
            padding: 12px;
            border: 2px solid transparent;
            border-radius: 10px;
            background: linear-gradient(white, white) padding-box,
            linear-gradient(90deg, #240ea0, #86135a, #561375, #1d68ad) border-box;
        }
        input:focus {
            box-shadow: 0px 0px 12px #270c6e;
            outline: none;
        }
        
        button {
            background: linear-gradient(180deg, #240ea0, #561375);
            color: white;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: box-shadow 0.15s;
        }
        button:hover {
            box-shadow: 2px 2px 10px #363636;
        }
        button:active {
            translate: 1px 1px;
        }

        .delete-btn {
            background: linear-gradient(180deg, #d12828, #4d1212);
            color: white;
        }
        .edit-btn {
            background: linear-gradient(180deg, #145f53, #126844);
            color: white;
            margin-left: 8px;
        }
        .save-btn {
            background: linear-gradient(180deg, #272747, #f045c5);
            color: white;
        }
        .status-btn {
            background: linear-gradient(180deg, #4c0d70, #4e1d42);
            color: white;   
            margin-left: 8px;
        }
    </style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Book Library</title>
</head>
<body>
    <h1>Personal Book Library</h1>

    <label for="book-name">Book Title:</label>
    <input type="text" placeholder="Book name..." id="book-name" maxlength="100"> <br><br>

    <label for="book-author">Book Author:</label>
    <input type="text" placeholder="Book author..." id="book-author" maxlength="100"> <br><br>

    <label for="book-pages">Book Pages:</label>
    <input type="text" placeholder="Book pages..." id="book-pages" maxlength="6"> <br><br>

    <button id="add-book">Add Book</button> <br><br>

    <p id="error-paragraph"></p>
    <div id="ul-list"></div>

    <script>
        const books = JSON.parse(localStorage.getItem('books')) || [];

        const bookName = document.querySelector('#book-name');
        const bookAuthor = document.querySelector('#book-author');
        const bookPages = document.querySelector('#book-pages');

        const addBookBtn = document.querySelector('#add-book');
        const errorParagraph = document.querySelector('#error-paragraph');
        const displayBooks = document.querySelector('#ul-list');

        function addBook() {
            if (bookName.value.trim() === '' ||
                bookAuthor.value.trim() === '' ||
                bookPages.value.trim() === '') {

                    errorParagraph.textContent = `Error: Please Enter a Value to Proceed!`;
                    errorParagraph.style.color = `darkred`;
                    return;
            };
            errorParagraph.textContent = '';

            books.unshift({
                title: bookName.value.trim(),
                author: bookAuthor.value.trim(),
                pages: bookPages.value.trim(),
                status: 'Reading'
            });

            updateUI();
        };
        addBookBtn.addEventListener('click', addBook);

        function renderBooks() {
            displayBooks.innerHTML = '';
            for (const book of books) {
                let statusColor;
                if (book.status === 'Completed') {
                        statusColor = 'green';
                    } else if (book.status === 'Reading') {
                        statusColor = 'purple';
                    } else {
                        statusColor = 'red';
                    }

                const bookList = document.createElement('p');
                bookList.innerHTML = `<h3>Book Title: ${book.title}</h3>
                <b>Book Author:</b> ${book.author}\n
                <b>Book Pages:</b> ${book.pages}\n
                <b>Status:</b> <span style="color: ${statusColor};">${book.status}</span>\n\n`;

                const editButton = document.createElement('button');
                editButton.textContent = `Edit`;
                editButton.classList.add('edit-btn');

                editButton.addEventListener('click', () => {
                    bookList.innerHTML = `
                    <b>Book Title:</b> <input type="text" maxlength="100" value="${book.title}" class="edit-name"><br>
                    <b>Book Author:</b> <input type="text" maxlength="100" value="${book.author}" class="edit-author"><br>
                    <b>Book Pages:</b> <input type="text" maxlength="6" value="${book.pages}" class="edit-pages"><br>`;

                    const saveButton = document.createElement('button');
                    saveButton.textContent = 'Save';
                    saveButton.classList.add('save-btn');

                    saveButton.addEventListener('click', () => {
                        const updatedName = document.querySelector('.edit-name').value.trim();
                        const updatedAuthor = document.querySelector('.edit-author').value.trim();
                        const updatedPage = document.querySelector('.edit-pages').value.trim();

                        if (updatedName && updatedAuthor && updatedPage) {
                            book.title = updatedName;
                            book.author = updatedAuthor;
                            book.pages = updatedPage;

                            errorParagraph.textContent = ``;
                            updateUI();
                            
                        } else {
                            errorParagraph.textContent = `Error: Please Enter a Value to Proceed!`;
                            errorParagraph.style.color = `red`;
                        }
                    })
                    bookList.append(saveButton);
                });

                const deleteButton = document.createElement('button');
                deleteButton.textContent = `Delete`;
                deleteButton.classList.add('delete-btn');

                deleteButton.addEventListener('click', () => {
                    const removeItem = books.indexOf(book);
                    books.splice(removeItem, 1);
                    updateUI();
                })

                const statusButton = document.createElement('button');
                statusButton.textContent = `Status`;
                statusButton.classList.add('status-btn');

                statusButton.addEventListener('click', () => {
                    if (book.status === 'Reading') {
                        book.status = 'Completed';
                    } else if (book.status === 'Completed') {
                        book.status = 'Unread';
                    } else {
                        book.status = 'Reading';
                    };
                    updateUI();
                })

                displayBooks.append(bookList);
                bookList.append(deleteButton);
                bookList.append(editButton);
                bookList.append(statusButton);

                const divider = document.createElement('hr');
                displayBooks.append(divider);
            }
            clearInput();
        };

        function clearInput() {
            bookName.value = '';
            bookAuthor.value = '';
            bookPages.value = '';
        };

        function saveBooks() {
            localStorage.setItem('books', JSON.stringify(books));
        };

        function updateUI() {
            saveBooks();
            renderBooks();
        };

        renderBooks();
    </script>
</body>
</html>
