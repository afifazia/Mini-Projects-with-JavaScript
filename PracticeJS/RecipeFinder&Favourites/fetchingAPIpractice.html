<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetching API</title>
</head>
<body>
    
    <script>
        fetch("https://api.jikan.moe/v4/anime/20")
        .then((response) => {
            if(!response.ok) {
                throw new Error ("Server Error");
            }
            return response.json();
        })
        .then((apiData) => {
            console.log("Here is your data:", apiData);
        })
        .catch((error) => {
            console.log("Error:", error);
        });
    </script>
</body>
</html>
