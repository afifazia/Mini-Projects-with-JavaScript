<!doctype html>
<html lang="en">
  <head>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      body::selection {
        background-color: #05050a;
        color: #00f0ff;
        text-shadow:
          0 0 8px #00f0ff,
          0 0 15px #00f0ff;
      }

      h1 {
        background: linear-gradient(180deg, #263d44, darkslategray);
        background-clip: text;
        color: transparent;
      }

      a {
        background: linear-gradient(90deg, #f156cb, #561375, #0f97a3);
        padding: 14px;
        color: white;
        font-weight: bold;
        border-radius: 6px;
        text-decoration: none;
        transition: box-shadow 0.15s;
        cursor: pointer;
      }
      a:hover {
        box-shadow: 2px 2px 10px #363636;
      }

      p {
        white-space: pre-line;
        color: #272747;
      }

      input {
        padding: 10px;
        border: 2px solid transparent;
        border-radius: 8px;
        background:
          linear-gradient(white, white) padding-box,
          linear-gradient(90deg, #f156cb, #7873f5, #4a9bde, #5956b9) border-box;
        transition: box-shadow 0.3s;
      }
      input:focus {
        box-shadow: 0 0 12px #7873f5;
        outline: none;
      }

      button {
        background: linear-gradient(180deg, #f156cb, #272747);
        padding: 14px;
        color: white;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        transition: box-shadow 0.15s;
        cursor: pointer;
      }
      button:hover {
        box-shadow:
          0 0 8px #240ea0,
          0 0 12px #3e0863;
      }
      button:active {
        translate: 1px 1px;
      }

      .delete-btn {
        background: linear-gradient(180deg, #272747, #363636);
      }
      .edit-btn {
        background: linear-gradient(180deg, #145f53, #124d68);
        margin-left: 8px;
      }
      .save-btn {
        background: linear-gradient(180deg, #330ba1, #124d68);
        margin-top: 20px;
      }
      .status-btn {
        background: linear-gradient(180deg, #240ea0, #561375);
        margin-left: 8px;
      }

      .search-series-style {
        border-radius: 60px;
        padding: 16px;
        font-size: 16px;
      }
    </style>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Series Watchlist</title>
  </head>
  <body>
    <h1>Series Watchlist</h1>
    <br />
    <a href="MovieWatchlist.html"> ⬅ Go Back</a> <br /><br /><br /><br />

    <label for="series-name">Series Title:</label>
    <input
      type="text"
      placeholder="Type a series..."
      id="series-name"
      maxlength="100"
    />
    <br /><br />

    <label for="series-genre">Series Genre:</label>
    <input
      type="text"
      placeholder="Type the genre..."
      id="series-genre"
      maxlength="100"
    />
    <br /><br />

    <label for="series-rating">Series Rating:</label>
    <input
      type="text"
      placeholder="Type the rating..."
      id="series-rating"
      maxlength="4"
    />
    <br /><br />

    <label for="series-year">Series Year:</label>
    <input
      type="text"
      placeholder="Type the year..."
      id="series-year"
      maxlength="4"
    />
    <br /><br />

    <label for="series-seasons">Number of Seasons:</label>
    <input
      type="text"
      placeholder="Type the seasons..."
      id="series-seasons"
      maxlength="4"
    />
    <br /><br />

    <button id="add-series-btn">Add Series</button> <br /><br /><br /><br />

    <input
      type="text"
      id="search-series"
      class="search-series-style"
      placeholder="Search your series..."
    />

    <p id="error-para"></p>
    <div id="display"></div>

    <script>
      const searchSeries = document.querySelector("#search-series");
      const seriesList = JSON.parse(localStorage.getItem("seriesList")) || [];

      const seriesName = document.querySelector("#series-name");
      const seriesGenre = document.querySelector("#series-genre");
      const seriesRating = document.querySelector("#series-rating");
      const seriesYear = document.querySelector("#series-year");
      const seriesSeasons = document.querySelector("#series-seasons");

      const errorParagraph = document.querySelector("#error-para");

      const addSeriesBtn = document.querySelector("#add-series-btn");
      const displaySeries = document.querySelector("#display");

      function searchSeriesFunc() {
        const searchInput = searchSeries.value.trim();
        const search = seriesList.filter((searchSeriesName) => {
          return searchSeriesName.name
            .toLowerCase()
            .includes(searchInput.toLowerCase());
        });
        renderSeries(search);
      }
      searchSeries.addEventListener("input", searchSeriesFunc);

      function seriesWatchlist() {
        if (
          seriesName.value.trim() === "" ||
          seriesGenre.value.trim() === "" ||
          seriesRating.value.trim() === "" ||
          seriesYear.value.trim() === "" ||
          seriesSeasons.value.trim() === ""
        ) {
          errorParagraph.textContent = `Error: Please Enter a Value to Proceed!`;
          errorParagraph.style.color = `red`;
          return;
        }
        errorParagraph.textContent = "";

        seriesList.unshift({
          name: seriesName.value.trim(),
          genre: seriesGenre.value.trim(),
          rating: seriesRating.value.trim(),
          year: seriesYear.value.trim(),
          seasons: seriesSeasons.value.trim(),
          status: "Watch Later",
        });
        updateUI();
      }
      addSeriesBtn.addEventListener("click", seriesWatchlist);

      function renderSeries(list = seriesList) {
        displaySeries.innerHTML = ``;

        for (const series of list) {
          let statusColor;
          if (series.status === "Watch Later") {
            statusColor = `red`;
          } else if (series.status === "Coming Soon!") {
            statusColor = `#f156cb`;
          } else {
            statusColor = `green`;
          }
          const paragraph = document.createElement("p");
          paragraph.innerHTML = `
                <b>Title:</b> ${series.name}\n<b>Genre:</b> ${series.genre}\n<b>Rating:</b> ${series.rating}\n<b>Year:</b> ${series.year}\n<b>Seasons:</b> ${series.seasons}\n<b>Status:</b> <span style="color: ${statusColor};">${series.status}</span>\n\n`;

          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = `Delete`;
          deleteBtn.classList.add("delete-btn");

          deleteBtn.addEventListener("click", () => {
            const seriesIndex = seriesList.indexOf(series);
            seriesList.splice(seriesIndex, 1);
            updateUI();
          });

          const editBtn = document.createElement("button");
          editBtn.textContent = `Edit`;
          editBtn.classList.add("edit-btn");

          editBtn.addEventListener("click", () => {
            paragraph.innerHTML = `
                    <b>Series Title</b> <input type="text" maxlength="100" class="edit-title" value="${series.name}"><br>
                    <b>Series Genre</b> <input type="text" maxlength="100" class="edit-genre" value="${series.genre}"><br>
                    <b>Series Rating</b> <input type="text" maxlength="5" class="edit-rating" value="${series.rating}"><br>
                    <b>Series Year</b> <input type="text" maxlength="4" class="edit-year" value="${series.year}"><br>
                    <b>Seasons</b> <input type="text" maxlength="4" class="edit-seasons" value="${series.seasons}"><br>`;

            const saveChangesBtn = document.createElement("button");
            saveChangesBtn.textContent = `Save Changes`;
            saveChangesBtn.classList.add("save-btn");

            saveChangesBtn.addEventListener("click", () => {
              const updatedSeriesTitle = paragraph
                .querySelector(".edit-title")
                .value.trim();
              const updatedSeriesGenre = paragraph
                .querySelector(".edit-genre")
                .value.trim();
              const updatedSeriesRating = paragraph
                .querySelector(".edit-rating")
                .value.trim();
              const updatedSeriesYear = paragraph
                .querySelector(".edit-year")
                .value.trim();
              const updatedSeriesSeasons = paragraph
                .querySelector(".edit-seasons")
                .value.trim();

              if (
                updatedSeriesTitle &&
                updatedSeriesGenre &&
                updatedSeriesRating &&
                updatedSeriesYear &&
                updatedSeriesSeasons
              ) {
                series.name = updatedSeriesTitle;
                series.genre = updatedSeriesGenre;
                series.rating = updatedSeriesRating;
                series.year = updatedSeriesYear;
                series.seasons = updatedSeriesSeasons;

                errorParagraph.textContent = "";
                updateUI();
              } else {
                errorParagraph.textContent = `Error: Please Enter a Value to Proceed!`;
                errorParagraph.style.color = `red`;
              }
            });
            paragraph.append(saveChangesBtn);
          });

          const statusBtn = document.createElement("button");
          statusBtn.textContent = `Status`;
          statusBtn.classList.add("status-btn");

          statusBtn.addEventListener("click", () => {
            if (series.status === "Watch Later") {
              series.status = "Watched";
            } else if (series.status === "Watched") {
              series.status = "Coming Soon!";
            } else {
              series.status = "Watch Later";
            }
            updateUI();
          });

          const divider = document.createElement("hr");
          displaySeries.append(divider);

          displaySeries.append(paragraph);
          paragraph.append(deleteBtn);
          paragraph.append(editBtn);
          paragraph.append(statusBtn);
        }

        seriesName.value = "";
        seriesGenre.value = "";
        seriesRating.value = "";
        seriesYear.value = "";
        seriesSeasons.value = "";
      }

      function saveSeries() {
        localStorage.setItem("seriesList", JSON.stringify(seriesList));
      }

      function updateUI() {
        saveSeries();
        renderSeries();
      }

      renderSeries(); //Page loads, Immediately render/show what's already saved.
    </script>
  </body>
</html>
